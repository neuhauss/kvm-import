name: Publish KVM API image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Check optional Docker Hub credentials
        id: dockerhub-credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Normalize GHCR image name
        id: ghcr
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rancher-kvm-api" >> "$GITHUB_OUTPUT"
      - name: Read release version
        id: version
        run: echo "tag=${GITHUB_REF_NAME##*-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: |
            ${{ steps.ghcr.outputs.name }}:${{ steps.version.outputs.tag }}
            ${{ steps.ghcr.outputs.name }}:latest
      - name: Log in to Docker Hub
        if: steps.dockerhub-credentials.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish optional Docker Hub image
        if: steps.dockerhub-credentials.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rancher-kvm-api:${{ steps.version.outputs.tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rancher-kvm-api:latest

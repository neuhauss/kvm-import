name: Publish KVM API image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Normalize GHCR image name
        id: ghcr
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rancher-kvm-api" >> "$GITHUB_OUTPUT"
      - name: Normalize Docker Hub image name
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=docker.io/${DOCKERHUB_USERNAME,,}/rancher-kvm-api" >> "$GITHUB_OUTPUT"
      - name: Read release version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./service
          file: ./service/Dockerfile
          push: true
          tags: |
            ${{ steps.ghcr.outputs.name }}:${{ steps.version.outputs.tag }}
            ${{ steps.ghcr.outputs.name }}:latest
            ${{ steps.dockerhub.outputs.name }}:${{ steps.version.outputs.tag }}
            ${{ steps.dockerhub.outputs.name }}:latest

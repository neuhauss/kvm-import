name: Build and Release Extension Catalog

on:
  workflow_dispatch:
    inputs:
      tagged_release:
        description: "Extension catalog tag, for example rancher-kvm-extension-0.1.4"
        required: true
        type: string

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  build-extension-catalog:
    uses: rancher/dashboard/.github/workflows/build-extension-catalog.yml@master
    permissions:
      actions: write
      contents: read
      packages: write
    with:
      registry_target: ghcr.io
      registry_user: ${{ github.actor }}
      tagged_release: ${{ inputs.tagged_release || github.ref_name }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release Extension Charts

on:
  workflow_dispatch:
    inputs:
      tagged_release:
        description: "Extension package tag, for example kvm-manager-0.7.5"
        required: true
        type: string
  release:
    types: [released]

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  build-extension-charts:
    uses: rancher/dashboard/.github/workflows/build-extension-charts.yml@master
    permissions:
      contents: write
      pull-requests: write
    with:
      target_branch: gh-pages
      tagged_release: ${{ inputs.tagged_release || github.ref_name }}

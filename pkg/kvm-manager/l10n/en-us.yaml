    qdeviceConfigureRisk: Runs SUSE's interactive QDevice setup on the first cluster node. It may require a maintenance window or cluster-service restart; review the displayed SUSE prompts and do not run during an unapproved workload outage.
    qdeviceConfigurePrerequisites: Complete the cluster bootstrap and join every selected node first. Confirm the external SLES QNetd host, SLE HA entitlement, corosync-qnetd package, access account, routing, and maintenance plan.
    qdeviceConfigureReviewWarning: This starts SUSE's interactive crm cluster init qdevice operation on the first selected member. It can configure QNetd certificates and SSH access, update cluster quorum configuration, and may require maintenance or restarting cluster services. SUSE warns that DLM-dependent workloads can need downtime; the extension does not manage maintenance mode or restart services for you.

    bootstrapErrorQdeviceAlreadyConfigured: QDevice is already configured. Refresh cluster status and inspect the live QNetd connection before taking another action.
    bootstrapErrorQdevicePreflight: QDevice setup preflight did not pass. Verify that all selected nodes are active members of the same quorate cluster and that the external QNetd plan is correct.
    fencingHelp: The fencing tool returned no data. This does not prove that fencing is configured or working.
    fencingTargetCoverageTitle: Which nodes have a registered fencing path?
    fencingTargetCoverageHelp: Read-only Pacemaker query listing registered devices that can fence each current node. An uncovered node needs a reviewed STONITH target mapping or a separately verified SBD design.
    fencingTargetCoverageUnknown: Pacemaker could not determine device coverage for every node. Refresh the status or inspect crm status and the fencing resources on the cluster.
    fencingTargetCovered: STONITH device mapping found
    fencingTargetUncovered: No registered STONITH device found
    fencingTargetUnknown: Coverage unknown
    fencingTargetCoverageCaveat: This checks Pacemaker's registered target mapping only. It does not log in to the physical device or trigger a fencing action; SBD is assessed separately above.
    fencingStatusCheckTitle: Manual fencing-device status check

    fencingRequiredBeforeBootstrapTitle: O bootstrap exige um plano de fencing
    fencingRequiredBeforeBootstrapHelp: Você pode salvar este plano como rascunho, mas não iniciar o cluster com o fencing indefinido. Escolha SBD após validar watchdog e armazenamento, ou selecione um dispositivo externo de fencing suportado.
    fencingAdvisorSbdTitle: SBD é uma opção candidata para revisão
    fencingAdvisorSbdHelp: Em cada host, a consulta SBD somente de leitura identificou um dispositivo watchdog cujo driver não é softdog. Isso não comprova que o watchdog seja adequado para hardware, não testa o fencing nem valida o desenho de armazenamento do SBD. Confirme o layout SBD suportado pela SUSE e o comportamento do watchdog antes de escolhê-lo; nunca execute um teste de watchdog em host de produção, pois ele pode reiniciar o nó.
    fencingAdvisorReviewTitle: O fencing precisa de uma análise separada
    fencingAdvisorReviewHelp: A pré-verificação não conseguiu associar, em todos os hosts, a saída do SBD a um watchdog de hardware identificado. Avalie um dispositivo externo de fencing suportado ou verifique os pré-requisitos de watchdog e armazenamento do SBD. Não prossiga com o fencing indefinido.
    fencingAdvisorTwoNodeHelp: Em clusters com dois nós, a SUSE informa que SBD sem disco não resolve split brain sem QDevice. SBD baseado em disco requer armazenamento de blocos compartilhado acessível por todos os nós.

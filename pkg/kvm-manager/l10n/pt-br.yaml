    configureQdevice: Configurar testemunha QDevice
    qdeviceConfigureRisk: Executa a configuração interativa QDevice da SUSE no primeiro nó do cluster. Pode exigir janela de manutenção ou reinício dos serviços do cluster; revise os prompts da SUSE e não execute durante uma indisponibilidade de cargas sem aprovação.
    qdeviceConfigurePrerequisites: Termine a inicialização do cluster e adicione todos os nós selecionados. Confirme o servidor externo SLES com QNetd, a extensão SLE HA, o pacote corosync-qnetd, a conta de acesso, as rotas e o plano de manutenção.
    qdeviceConfigureReviewWarning: Isso inicia a operação interativa SUSE crm cluster init qdevice no primeiro membro selecionado. Ela pode configurar certificados e acesso SSH do QNetd, atualizar a configuração de quorum e exigir manutenção ou reinício dos serviços do cluster. A SUSE alerta que cargas dependentes de DLM podem precisar de indisponibilidade; a extensão não ativa modo de manutenção nem reinicia serviços.
    bootstrapConfigureQdevice: configurar a testemunha QDevice/QNetd
    bootstrapErrorQdeviceAlreadyConfigured: O QDevice já está configurado. Atualize o estado do cluster e confira a conexão ativa com QNetd antes de outra ação.
    bootstrapErrorQdevicePreflight: A pré-verificação do QDevice não passou. Confirme que todos os nós selecionados pertencem ao mesmo cluster ativo com quorum e que o plano externo QNetd está correto.
    fencingHelp: A ferramenta de fencing não retornou dados. Isso não prova que o fencing está configurado ou funcional.
    fencingTargetCoverageTitle: Quais nós têm um caminho de fencing registrado?
    fencingTargetCoverageHelp: Consulta somente de leitura do Pacemaker que lista os dispositivos registrados capazes de aplicar fencing em cada nó atual. Um nó sem cobertura precisa de um mapeamento STONITH revisado ou de um projeto SBD verificado separadamente.
    fencingTargetCoverageUnknown: O Pacemaker não conseguiu determinar a cobertura de dispositivos para todos os nós. Atualize o estado ou confira crm status e os recursos de fencing no cluster.
    fencingTargetCovered: Mapeamento de dispositivo STONITH encontrado
    fencingTargetUncovered: Nenhum dispositivo STONITH registrado encontrado
    fencingTargetUnknown: Cobertura desconhecida
    fencingTargetCoverageCaveat: Esta consulta verifica somente o mapeamento registrado no Pacemaker. Ela não acessa o dispositivo físico nem executa uma ação de fencing; o SBD é avaliado separadamente acima.
    fencingStatusCheckTitle: Verificação manual do dispositivo de fencing
    fencingStatusCheckHelp: Esta ação acessa o dispositivo configurado pelo Pacemaker. A SUSE alerta que alguns equipamentos de gerenciamento de energia podem ficar sobrecarregados ou rejeitar verificações simultâneas; por isso, a extensão limita a consulta a uma por dispositivo a cada três horas. Ela não cerca nem reinicia um nó e não comprova que uma operação real de fencing terá sucesso.
    checkFencingStatus: Verificar estado do dispositivo
    fencingStatusChecking: Verificando dispositivo…
    fencingStatus_query_succeeded: Consulta de estado do dispositivo concluída
    fencingStatus_query_failed: A consulta de estado falhou; verifique os logs do Pacemaker e o acesso ao dispositivo
    fencingStatus_unknown: Estado do dispositivo desconhecido
    fencingStatusNextCheck: Próxima consulta disponível {time}
    fencingBestPractice: Com 2 nós, a SUSE recomenda QDevice/QNetd para um voto independente. Em qualquer topologia, valide STONITH/SBD antes de executar cargas de trabalho; ler a configuração não comprova que o fencing funciona.
    installHaStackTitle: Instalar as ferramentas do cluster SUSE HA
    installHaStackHelp: Instala o padrão oficial ha_sles com zypper nos hosts selecionados. A extensão SLE HA precisa estar ativa e os repositórios acessíveis. Pacemaker, Corosync e Hawk são iniciados pelo fluxo suportado de inicialização do cluster.

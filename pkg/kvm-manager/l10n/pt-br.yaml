    fencingCreateSafetyTitle: O fencing pode desligar nós do cluster
    fencingCreateSafetyHelp: Crie cada dispositivo para um nó-alvo atual e valide as credenciais e o acesso fora de banda antes de iniciá-lo. Os novos dispositivos ficam Parados; iniciá-los habilita o fencing do Pacemaker e pode desligar o nó-alvo durante uma recuperação. Mantenha ao menos um caminho de fencing validado para cada nó.

    editFencingDevice: Editar dispositivo de fencing
    fencingEditHelp: Altere parâmetros somente com o dispositivo de fencing parado. Os valores existentes nunca são carregados de volta no formulário.
    fencingEditPreservesTarget: O mapeamento do alvo fica bloqueado
    fencingEditPreservesTargetHelp: Este formulário aceita somente dispositivos associados a um nó atual. O mapeamento existente e as operações de monitoramento são preservados.
    fencingEditParametersHelp: Deixe em branco um valor existente para mantê-lo. Digite um valor novo para substituí-lo ou marque Remover. Novos parâmetros precisam de nome e valor.

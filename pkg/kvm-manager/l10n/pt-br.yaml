    fencingSbdSummary: "SBD {type} está configurado no nó consultado ({host}). Confira o estado do SBD e do watchdog em todos os membros antes de depender do fencing."
    fencingSbdScopeHelp: Este estado vem somente do nó consultado e confirma a configuração, não um teste de fencing bem-sucedido. Verifique crm sbd status em cada membro e valide o watchdog antes de usar em produção.
    fencingSbdNoResourceTitle: SBD sem disco não cria recurso de fencing no Pacemaker
    fencingSbdNoResourceHelp: "Isso é esperado no SBD sem disco: a SUSE configura o fencing pelo SBD e pelo watchdog, sem recurso fence_sbd. O estado acima vem apenas do nó consultado; confira todos os membros."

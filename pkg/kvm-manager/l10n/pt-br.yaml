    qdeviceStatusUnknown: Estado do QDevice indisponível
    qdeviceStatusHelp: Estado atual informado pelo crmsh da SUSE. Uma testemunha conectada participa do quorum, mas isso não comprova o funcionamento do fencing nem a prontidão para produção.
    qdeviceNotConfiguredHelp: A ferramenta de quorum não informa voto do QDevice. Clusters com quantidade par de nós, especialmente com dois nós, devem avaliar a recomendação SUSE de QDevice/QNetd.
    qdeviceUnknownHelp: A API atual ou as ferramentas SUSE não forneceram dados suficientes para determinar o estado do QDevice. Atualize o estado do cluster antes de tirar conclusões.

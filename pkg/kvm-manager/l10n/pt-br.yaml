    bootstrapTerminalTitle: Bootstrap SUSE HA restrito
    bootstrapTerminalNote: Esta sessão executa somente o comando salvo crm cluster init ou join. Ela não abre um shell geral do host.
    bootstrapCloseWarning: Fechar este terminal desconecta a configuração interativa da SUSE e pode deixar o cluster parcialmente configurado. Sempre que possível, mantenha-o aberto até o crmsh terminar.
    bootstrapCloseConfirm: Desconectar mesmo assim
    bootstrapCloseKeepOpen: Manter configuração aberta
    bootstrapNoReconnect: Esta operação de bootstrap não pode ser reconectada nem repetida neste terminal. Verifique a associação dos nós e execute uma nova pré-verificação antes de continuar.
    bootstrapPreflightRunning: Verificando novamente SUSE HA, estado dos nós, sincronização de horário e conectividade entre pares...
    bootstrapCommandFailed: O comando de bootstrap SUSE terminou com o código {status}.
    bootstrapCredentialHardening: Inicialização concluída. Antes de disponibilizar o Hawk, altere a senha da conta hacluster no host com `sudo passwd hacluster` e guarde a nova credencial com segurança.
    bootstrapOperationConflict: Já existe outra operação de cluster em andamento em um dos hosts selecionados. Aguarde, atualize a pré-verificação e tente novamente.
    bootstrapErrorGeneric: A configuração do cluster SUSE não pôde continuar. Revise a conexão do host e a pré-verificação mais recente e tente novamente.
    bootstrapErrorSshAuthentication: A autenticação SSH deste host falhou. Confira o usuário e as credenciais importadas e execute a pré-verificação novamente.
    bootstrapErrorSshHostKey: A chave SSH do host não corresponde à chave fixada para ele. Verifique a identidade do host antes de alterar a chave e tente novamente.
    bootstrapErrorSshTimeout: O host não respondeu antes do tempo limite SSH. Verifique se está disponível e acessível pela rede e tente novamente.
    bootstrapErrorSshConnectivity: A extensão não conseguiu abrir uma sessão SSH com o host. Confira serviço SSH, endereço, porta e firewall.
    bootstrapErrorSudo: A conta Linux importada precisa de acesso sudo funcional para configurar o cluster SUSE. Confira a política sudo e tente novamente.
    bootstrapErrorUnsupportedSles: Este host não usa uma versão do SUSE Linux Enterprise compatível com este fluxo de HA.
    bootstrapErrorHaProductUnconfirmed: Não foi possível confirmar a versão ativa do produto SLE HA em todos os nós selecionados. Confira se SUSEConnect mostra a extensão HA ativa em cada host e execute a pré-verificação novamente.
    bootstrapErrorHaProductMismatch: Os nós selecionados têm versões diferentes do produto SLE HA ativo. Alinhe a versão do SLE HA em todos os nós antes de inicializar um novo cluster.
    bootstrapErrorHaNotReady: A extensão SLE HA ou as ferramentas crmsh e Corosync necessárias não estão ativas neste host. Revise Subscriptions e Modules & Extensions.
    bootstrapErrorTimeSync: A sincronização de horário não está pronta neste host. Configure e valide chrony/NTP em todos os nós selecionados.
    bootstrapErrorQnetd: O witness QNetd selecionado está inacessível na porta TCP 5403. Confira endereço, rota e firewall.
    bootstrapErrorPeerNames: Um nó não consegue resolver o nome dos outros nós. Adicione mapeamentos estáveis em todos os hosts e execute a pré-verificação novamente.
    bootstrapErrorPeerConnectivity: Os nós selecionados não conseguem alcançar a porta SSH de um peer. Confira endereços e firewall e execute a pré-verificação novamente.
    bootstrapErrorExistingCluster: Um host selecionado já possui configuração Corosync. Revise a associação HA existente antes de continuar.
    bootstrapErrorInitializeFirst: O primeiro nó selecionado não está reportando o cluster planejado. Inicialize ou recupere-o e atualize a pré-verificação.
    bootstrapErrorMembershipMismatch: Os hosts selecionados reportam nomes de cluster HA diferentes. Revise a associação e corrija o plano antes de continuar.
    bootstrapErrorPreflightConnectivity: Não foi possível concluir as verificações atualizadas dos hosts. Verifique o SSH e execute a pré-verificação novamente.
    bootstrapReviewTitle: Revise o bootstrap do cluster SUSE
    bootstrapReviewText: A extensão executará {operation} em {host} após uma nova pré-verificação em tempo real.
    bootstrapReviewWarning: O crmsh é interativo e altera o estado do Corosync e do Pacemaker. Confirme rede, testemunha de quorum, fencing e ordem dos nós antes de continuar.

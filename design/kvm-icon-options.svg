    <text x="110" y="132" fill="#a9b2bf" font-family="Arial,sans-serif" font-size="13">Rancher-style thin outline</text>
    <text x="110" y="152" fill="#a9b2bf" font-family="Arial,sans-serif" font-size="13">with KVM clearly inside.</text>

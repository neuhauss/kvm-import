apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kvm-api-data
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-api
    app.kubernetes.io/part-of: rancher-kvm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: default
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvm-api
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-api
    app.kubernetes.io/part-of: rancher-kvm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kvm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvm-api
        app.kubernetes.io/part-of: rancher-kvm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /service
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              python -m pip install --disable-pip-version-check --no-cache-dir
              --target /tmp/python-deps -r /service/requirements.txt &&
              export PYTHONPATH=/tmp/python-deps &&
              exec /usr/local/bin/python -m uvicorn app:app --host 0.0.0.0 --port 8080
          env:
            - name: KVM_DB_PATH
              value: /data/kvm-hosts.sqlite3
            - name: KVM_KNOWN_HOSTS
              value: /etc/kvm/known_hosts
            - name: KVM_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: kvm-api-secrets
                  key: credential-key
            - name: RANCHER_API_URL
              value: https://rancher.example.com
            - name: RANCHER_CA_FILE
              value: /etc/rancher-ca/ca.crt
            - name: RANCHER_PUBLIC_ORIGIN
              value: https://rancher.example.com
            - name: KVM_ALLOWED_GLOBAL_ROLES
              value: admin
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: source
              mountPath: /service
              readOnly: true
            - name: known-hosts
              mountPath: /etc/kvm
              readOnly: true
            - name: rancher-ca
              mountPath: /etc/rancher-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kvm-api-data
        - name: source
          configMap:
            name: kvm-api-source
        - name: known-hosts
          configMap:
            name: kvm-known-hosts
        - name: rancher-ca
          configMap:
            name: kvm-rancher-ca
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kvm-api
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-api
    app.kubernetes.io/part-of: rancher-kvm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kvm-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvm-api
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-api
    app.kubernetes.io/part-of: rancher-kvm
spec:
  ingressClassName: traefik
  rules:
    - host: rancher.example.com
      http:
        paths:
          - path: /kvm-api
            pathType: Prefix
            backend:
              service:
                name: kvm-api
                port:
                  number: 8080
          - path: /kvm-cockpit
            pathType: Prefix
            backend:
              service:
                name: kvm-api
                port:
                  number: 8080

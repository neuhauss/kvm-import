apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvm-extension-assets
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-extension-assets
    app.kubernetes.io/part-of: rancher-kvm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvm-extension-assets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvm-extension-assets
        app.kubernetes.io/part-of: rancher-kvm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: httpd
        image: httpd:2.4-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - mkdir -p /tmp/www && cp -R /usr/local/apache2/htdocs/. /tmp/www/ && gzip -dc /tmp/www/kvm-manager/0.7.35/plugin/kvm-manager-0.7.35.umd.min.303.js.gz > /tmp/www/kvm-manager/0.7.35/plugin/kvm-manager-0.7.35.umd.min.303.js && rm /tmp/www/kvm-manager/0.7.35/plugin/kvm-manager-0.7.35.umd.min.303.js.gz && sed -e 's/^Listen 80$/Listen 8080/' -e 's#DocumentRoot "/usr/local/apache2/htdocs"#DocumentRoot "/tmp/www"#' -e 's#<Directory "/usr/local/apache2/htdocs">#<Directory "/tmp/www">#' -e 's/^#LoadModule deflate_module /LoadModule deflate_module /' -e '/^LoadModule deflate_module /a AddOutputFilterByType DEFLATE text/javascript application/javascript application/json text/css image/svg+xml' /usr/local/apache2/conf/httpd.conf > /tmp/httpd.conf && exec httpd -f /tmp/httpd.conf -DFOREGROUND
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: assets
          mountPath: /usr/local/apache2/htdocs
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /usr/local/apache2/logs
      volumes:
      - name: assets
        configMap:
          name: kvm-extension-assets-0-7-35
          items:
          - key: files-0.7.35.txt
            path: kvm-manager/0.7.35/files.txt
          - key: package-root-0.7.35.json
            path: kvm-manager/0.7.35/package.json
          - key: package-0.7.35.json
            path: kvm-manager/0.7.35/plugin/package.json
          - key: kvm-manager-0.7.35.umd.min.148.js
            path: kvm-manager/0.7.35/plugin/kvm-manager-0.7.35.umd.min.148.js
          - key: kvm-manager-0.7.35.umd.min.303.js.gz
            path: kvm-manager/0.7.35/plugin/kvm-manager-0.7.35.umd.min.303.js.gz
          - key: kvm-manager-0.7.35.umd.min.37.js
            path: kvm-manager/0.7.35/plugin/kvm-manager-0.7.35.umd.min.37.js
          - key: kvm-manager-0.7.35.umd.min.js
            path: kvm-manager/0.7.35/plugin/kvm-manager-0.7.35.umd.min.js
          - key: kvm-manager-0.7.35.umd.min.kvm-vm-console.js
            path: kvm-manager/0.7.35/plugin/kvm-manager-0.7.35.umd.min.kvm-vm-console.js
          - key: asset-0.7.35-kvm.f932afc0.svg
            path: kvm-manager/0.7.35/plugin/img/kvm.f932afc0.svg
          - key: catalog-index.yaml
            path: catalog/index.yaml
          - key: catalog-chart-0.7.34.tgz
            path: catalog/kvm-manager-0.7.34.tgz
          - key: catalog-chart-0.7.35.tgz
            path: catalog/kvm-manager-0.7.35.tgz
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kvm-extension-assets
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-extension-assets
    app.kubernetes.io/part-of: rancher-kvm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kvm-extension-assets
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: catalog.cattle.io/v1
kind: UIPlugin
metadata:
  name: kvm-manager
  namespace: cattle-ui-plugin-system
spec:
  plugin:
    name: kvm-manager
    version: 0.7.35
    endpoint: http://kvm-extension-assets.rancher-kvm-registry.svc:8080/kvm-manager/0.7.35
    noCache: false
    noAuth: false
    metadata:
      catalog.cattle.io/rancher-version: '>=2.15.0'
      catalog.cattle.io/ui-extensions-version: '>=3.0.0 <4.0.0'

  name: kvm-extension-assets
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-extension-assets
    app.kubernetes.io/part-of: rancher-kvm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvm-extension-assets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvm-extension-assets
        app.kubernetes.io/part-of: rancher-kvm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: httpd
        image: httpd:2.4-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - mkdir -p /tmp/www && cp -R /usr/local/apache2/htdocs/. /tmp/www/ && gzip -dc /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.148.js.gz > /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.148.js && rm /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.148.js.gz && gzip -dc /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.177.js.gz > /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.177.js && rm /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.177.js.gz && gzip -dc /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.303.js.gz > /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.303.js && rm /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.303.js.gz && gzip -dc /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.37.js.gz
          > /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.37.js && rm /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.37.js.gz && gzip -dc /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.437.js.gz > /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.437.js && rm /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.437.js.gz && gzip -dc /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.js.gz > /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.js && rm /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.js.gz && gzip -dc /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.kvm-cloud-native.js.gz > /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.kvm-cloud-native.js
          && rm /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.kvm-cloud-native.js.gz && gzip -dc /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.kvm-vm-console.js.gz > /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.kvm-vm-console.js && rm /tmp/www/kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.kvm-vm-console.js.gz && sed -e 's/^Listen 80$/Listen 8080/' -e 's#DocumentRoot "/usr/local/apache2/htdocs"#DocumentRoot "/tmp/www"#' -e 's#<Directory "/usr/local/apache2/htdocs">#<Directory "/tmp/www">#' -e 's/^#LoadModule deflate_module /LoadModule deflate_module /' -e '/^LoadModule deflate_module /a AddOutputFilterByType DEFLATE text/javascript application/javascript application/json text/css image/svg+xml' /usr/local/apache2/conf/httpd.conf > /tmp/httpd.conf && exec httpd -f /tmp/httpd.conf -DFOREGROUND
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: assets
          mountPath: /usr/local/apache2/htdocs
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /usr/local/apache2/logs
      volumes:
      - name: assets
        configMap:
          name: kvm-extension-assets-0-8-0-unstable-21
          items:
          - key: files-0.8.0-unstable.21.txt
            path: kvm-manager/0.8.0-unstable.21/files.txt
          - key: package-root-0.8.0-unstable.21.json
            path: kvm-manager/0.8.0-unstable.21/package.json
          - key: package-0.8.0-unstable.21.json
            path: kvm-manager/0.8.0-unstable.21/plugin/package.json
          - key: kvm-manager-0.8.0-unstable.21.umd.min.148.js.gz
            path: kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.148.js.gz
          - key: kvm-manager-0.8.0-unstable.21.umd.min.177.js.gz
            path: kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.177.js.gz
          - key: kvm-manager-0.8.0-unstable.21.umd.min.303.js.gz
            path: kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.303.js.gz
          - key: kvm-manager-0.8.0-unstable.21.umd.min.37.js.gz
            path: kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.37.js.gz
          - key: kvm-manager-0.8.0-unstable.21.umd.min.437.js.gz
            path: kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.437.js.gz
          - key: kvm-manager-0.8.0-unstable.21.umd.min.js.gz
            path: kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.js.gz
          - key: kvm-manager-0.8.0-unstable.21.umd.min.kvm-cloud-native.js.gz
            path: kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.kvm-cloud-native.js.gz
          - key: kvm-manager-0.8.0-unstable.21.umd.min.kvm-vm-console.js.gz
            path: kvm-manager/0.8.0-unstable.21/plugin/kvm-manager-0.8.0-unstable.21.umd.min.kvm-vm-console.js.gz
          - key: asset-0.8.0-unstable.21-kvm.f932afc0.svg
            path: kvm-manager/0.8.0-unstable.21/plugin/img/kvm.f932afc0.svg
          - key: catalog-index.yaml
            path: catalog/index.yaml
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kvm-extension-assets
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-extension-assets
    app.kubernetes.io/part-of: rancher-kvm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kvm-extension-assets
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: catalog.cattle.io/v1
kind: UIPlugin
metadata:
  name: kvm-manager
  namespace: cattle-ui-plugin-system
spec:
  plugin:
    name: kvm-manager
    version: 0.8.0-unstable.21
    endpoint: https://rancher.example.com/kvm-manager/0.8.0-unstable.21
    noCache: true
    noAuth: false
    metadata:
      catalog.cattle.io/rancher-version: '>=2.15.0'
      catalog.cattle.io/ui-extensions-version: '>=3.0.0 <4.0.0'
      catalog.cattle.io/display-name: KVM
      catalog.cattle.io/ui-component: plugins
      catalog.cattle.io/namespace: cattle-ui-plugin-system
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvm-extension-assets
  namespace: rancher-kvm-registry
  labels:
    app.kubernetes.io/name: kvm-extension-assets
    app.kubernetes.io/part-of: rancher-kvm
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /kvm-manager
        pathType: Prefix
        backend:
          service:
            name: kvm-extension-assets
            port:
              number: 8080
    host: rancher.example.com

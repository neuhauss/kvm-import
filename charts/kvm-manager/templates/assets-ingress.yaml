{{- if .Values.ingress.enabled }}
{{- $origin := trimSuffix "/" .Values.rancher.publicOrigin -}}
{{- $host := regexReplaceAll "^https?://([^/]+).*$" $origin "$1" -}}
{{- $ipHost := or (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $host) (contains ":" $host) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvm-extension-assets
  namespace: {{ .Values.backend.namespace }}
  labels:
    app.kubernetes.io/name: kvm-extension-assets
    app.kubernetes.io/part-of: rancher-kvm
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    -
{{ if not $ipHost }}
      host: {{ $host | quote }}
{{ end }}
      http:
        paths:
          - path: /kvm-manager
            pathType: Prefix
            backend:
              service:
                name: kvm-extension-assets
                port:
                  number: 8080
{{- end }}

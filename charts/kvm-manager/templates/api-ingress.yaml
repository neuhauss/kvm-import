{{- if .Values.ingress.enabled }}
{{- $origin := trimSuffix "/" .Values.rancher.publicOrigin -}}
{{- $hostWithPort := regexReplaceAll "^https?://([^/]+).*$" $origin "$1" -}}
{{- $host := regexReplaceAll "^([^:]+):[0-9]+$" $hostWithPort "$1" -}}
{{- $ipHost := or (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $host) (contains ":" $host) -}}
{{- $annotations := dict "nginx.ingress.kubernetes.io/proxy-body-size" "8g" "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-request-buffering" "off" -}}
{{- if .Values.ingress.annotations }}{{- $annotations = mergeOverwrite $annotations .Values.ingress.annotations }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvm-api
  namespace: {{ .Values.backend.namespace }}
  labels:
    app.kubernetes.io/name: kvm-api
    app.kubernetes.io/part-of: rancher-kvm
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    -
{{ if not $ipHost }}
      host: {{ $host | quote }}
{{ end }}
      http:
        paths:
          - path: /kvm-api
            pathType: Prefix
            backend:
              service:
                name: kvm-api
                port:
                  number: 8080
          - path: /kvm-cockpit
            pathType: Prefix
            backend:
              service:
                name: kvm-api
                port:
                  number: 8080
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvm-extension-assets
  namespace: {{ .Values.backend.namespace }}
  labels:
    app.kubernetes.io/name: kvm-extension-assets
    app.kubernetes.io/part-of: rancher-kvm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvm-extension-assets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvm-extension-assets
        app.kubernetes.io/part-of: rancher-kvm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpd
          image: {{ .Values.assets.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              mkdir -p /tmp/www && cp -R /usr/local/apache2/htdocs/. /tmp/www/ &&
              gzip -dc /tmp/www/kvm-manager/{{ .Chart.Version }}/plugin/kvm-manager-{{ .Chart.Version }}.umd.min.303.js.gz > /tmp/www/kvm-manager/{{ .Chart.Version }}/plugin/kvm-manager-{{ .Chart.Version }}.umd.min.303.js &&
              rm /tmp/www/kvm-manager/{{ .Chart.Version }}/plugin/kvm-manager-{{ .Chart.Version }}.umd.min.303.js.gz &&
              sed -e 's/^Listen 80$/Listen 8080/'
              -e 's#DocumentRoot "/usr/local/apache2/htdocs"#DocumentRoot "/tmp/www"#'
              -e 's#<Directory "/usr/local/apache2/htdocs">#<Directory "/tmp/www">#'
              -e 's/^#LoadModule deflate_module /LoadModule deflate_module /'
              -e '/^LoadModule deflate_module /a AddOutputFilterByType DEFLATE text/javascript application/javascript application/json text/css image/svg+xml'
              /usr/local/apache2/conf/httpd.conf > /tmp/httpd.conf &&
              exec httpd -f /tmp/httpd.conf -DFOREGROUND
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.assets.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: assets
              mountPath: /usr/local/apache2/htdocs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /usr/local/apache2/logs
      volumes:
        - name: assets
          configMap:
            name: kvm-extension-assets-{{ .Chart.Version | replace "." "-" }}
            items:
{{ .Files.Get "files/assets-items.yaml" | nindent 14 }}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}

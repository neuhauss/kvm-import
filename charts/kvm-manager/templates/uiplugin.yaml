apiVersion: catalog.cattle.io/v1
kind: UIPlugin
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  plugin:
    name: {{ .Chart.Name }}
    version: {{ .Chart.Version | quote }}
    endpoint: {{ .Values.plugin.endpoint | default (printf "%s/kvm-manager/%s" (trimSuffix "/" .Values.rancher.publicOrigin) .Chart.Version) | quote }}
    # The extension is served from a versioned endpoint; do not let Rancher
    # retain stale plugin metadata/assets after a local catalog upgrade.
    noCache: true
    noAuth: false
    metadata:
      catalog.cattle.io/display-name: KVM
      catalog.cattle.io/ui-component: plugins
      catalog.cattle.io/namespace: {{ .Release.Namespace | quote }}
      catalog.cattle.io/rancher-version: ">=2.15.0"
      catalog.cattle.io/ui-extensions-version: ">=3.0.0 <4.0.0"

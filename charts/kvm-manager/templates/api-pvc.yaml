apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kvm-api-data
  namespace: {{ .Values.backend.namespace }}
  labels:
    app.kubernetes.io/name: kvm-api
    app.kubernetes.io/part-of: rancher-kvm
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backend.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.storage.size | quote }}

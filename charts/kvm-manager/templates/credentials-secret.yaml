{{- $namespace := .Values.backend.namespace -}}
{{- $secretName := "kvm-api-secrets" -}}
{{- $existing := lookup "v1" "Secret" $namespace $secretName -}}
{{- $credentialKey := "" -}}
{{- if $existing -}}
  {{- $credentialKey = (index $existing.data "credential-key" | b64dec) -}}
{{- else -}}
  {{- $credentialKey = randBytes 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: kvm-api
    app.kubernetes.io/part-of: rancher-kvm
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  credential-key: {{ $credentialKey | quote }}
